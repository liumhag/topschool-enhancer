<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>TopSchool 相簿下載器</title><link rel="stylesheet" href="download.css"><body><main><h1>TopSchool 相簿下載器</h1><p>每本相簿各自存成 ZIP。下載期間請保持此分頁開啟。</p><section class="settings"><label for="directory">下載子目錄</label><input id="directory" type="text" maxlength="100" placeholder="例如 TopSchool/2026"><small>位於 Chrome 預設下載資料夾內；可用 <code>/</code> 建立多層子目錄。</small><label class="option"><input id="skip-downloaded" type="checkbox" checked>掃描後取消勾選已下載相簿</label><button id="clear-history" type="button">清除下載紀錄</button></section><div class="actions"><button id="scan">掃描完整相簿列表</button><button id="all">全選</button><button id="none">取消全選</button><button id="start" disabled>下載選取相簿</button><button id="cancel" disabled>停止</button></div><p id="status" role="status"></p><div id="list"></div><pre id="log"></pre></main><script src="core.js"></script><script src="zip.js"></script><script src="download.js"></script></body></html>
