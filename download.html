<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>TopSchool 相簿下載器</title><link rel="stylesheet" href="download.css"><body><main><small id="version" class="version"></small><h1>TopSchool 相簿下載器</h1><p>每本相簿各自存成 ZIP。下載期間請保持此分頁開啟。</p><section class="settings"><div class="setting-heading"><strong>設定下載至本機資料夾</strong><small>首次選擇或權限失效時，需要授權 Chrome 存取指定資料夾，才能將相簿下載至該位置。</small></div><div class="directory-row"><button id="choose-directory" type="button">選擇資料夾</button><button id="refresh-directory" type="button">完整掃描比對</button><strong id="directory-name">尚未選擇</strong></div><label class="option"><input id="skip-downloaded" type="checkbox" checked>掃描後取消勾選已下載相簿</label></section><div class="actions"><button id="scan">掃描相簿列表</button><button id="all">全選</button><button id="none">取消全選</button><button id="start" disabled>下載選取相簿</button><button id="cancel" disabled>停止</button></div><p id="status" role="status"></p><div id="list"></div><pre id="log"></pre></main><script src="core.js"></script><script src="zip.js"></script><script src="download.js"></script></body></html>
