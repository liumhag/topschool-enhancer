<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>TopSchool 相簿下載器</title><link rel="stylesheet" href="download.css"><body><main><h1>TopSchool 相簿下載器</h1><p>每本相簿各自存成 ZIP。下載期間請保持此分頁開啟。</p><section class="settings"><span class="setting-label">授權資料夾</span><div class="directory-row"><button id="choose-directory" type="button">選擇資料夾</button><strong id="directory-name">尚未選擇</strong></div><small>實際寫入由 Chrome 授權控制；可選擇 D 槽等位置內的資料夾。</small><label for="path-label" class="setting-label">完整路徑顯示</label><input id="path-label" type="text" maxlength="260" placeholder="例如 D:\TopSchool"><small>Chrome 不會提供完整路徑，請輸入一次作為畫面與下載紀錄的顯示名稱。</small><label class="option"><input id="skip-downloaded" type="checkbox" checked>掃描後取消勾選已下載相簿</label><button id="refresh-directory" type="button">重新掃描資料夾</button></section><div class="actions"><button id="scan">掃描完整相簿列表</button><button id="all">全選</button><button id="none">取消全選</button><button id="start" disabled>下載選取相簿</button><button id="cancel" disabled>停止</button></div><p id="status" role="status"></p><div id="list"></div><pre id="log"></pre></main><script src="core.js"></script><script src="zip.js"></script><script src="download.js"></script></body></html>
